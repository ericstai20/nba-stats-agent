spring.application.name=agent-app

# Load the settings in the project's .env file, including the API key. This path
# is relative to where the app starts, so run the app from the agent-app folder.
spring.config.import=optional:file:../.env[.properties]

# Only accept requests from this computer, so nobody else on your network can use
# the app to spend your API credits.
server.address=127.0.0.1
