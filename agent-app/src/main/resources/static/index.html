<!DOCTYPE html>
<!--
  The app's web page. Spring Boot automatically serves files in the "static" folder,
  and index.html is what you get at http://localhost:8080/

  A web page has three layers:
    HTML        what's on the page
    CSS         how it looks (the <style> section)
    JavaScript  what it does (the <script> section)
-->
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>NBA Stats Agent</title>
	<style>
		/* Lets the browser match the computer's light or dark mode. */
		:root {
			color-scheme: light dark;
			--accent: light-dark(#b4441c, #f08a5d);
			--muted: light-dark(#5f6368, #a8adb3);
			--panel: light-dark(#f4f4f2, #26282b);
			--error: light-dark(#b3261e, #f2b8b5);
		}

		body {
			max-width: 40rem;
			margin: 0 auto;
			padding: 3rem 1.25rem;
			font-family: system-ui, sans-serif;
			line-height: 1.5;
		}

		h1 {
			margin: 0;
			font-size: 1.75rem;
		}

		.intro {
			margin: 0.25rem 0 1.5rem;
			color: var(--muted);
		}

		label {
			display: block;
			margin-bottom: 0.4rem;
			font-weight: 600;
		}

		.ask-row {
			display: flex;
			gap: 0.5rem;
		}

		input {
			flex: 1;
			min-width: 0;
			padding: 0.65rem 0.75rem;
			border: 1px solid var(--muted);
			border-radius: 8px;
			font: inherit;
		}

		button {
			padding: 0.65rem 1.1rem;
			border: 1px solid var(--accent);
			border-radius: 8px;
			background: var(--accent);
			color: light-dark(#fff, #1b1b1b);
			font: inherit;
			font-weight: 600;
			cursor: pointer;
		}

		button:disabled {
			opacity: 0.55;
			cursor: not-allowed;
		}

		.examples {
			display: flex;
			flex-wrap: wrap;
			gap: 0.5rem;
			margin-top: 0.75rem;
		}

		.examples button {
			padding: 0.3rem 0.7rem;
			background: transparent;
			border-color: var(--muted);
			color: inherit;
			font-size: 0.875rem;
			font-weight: 400;
		}

		#conversation:not(:empty) {
			margin-bottom: 1.5rem;
		}

		.message {
			margin-top: 0.75rem;
			padding: 0.75rem 1rem;
			border-radius: 8px;
			/* Keeps the line breaks in Claude's answer. */
			white-space: pre-wrap;
		}

		.question {
			font-weight: 600;
		}

		.answer {
			background: var(--panel);
		}

		.loading {
			background: var(--panel);
			color: var(--muted);
		}

		.error {
			background: var(--panel);
			color: var(--error);
		}

		#new-conversation {
			margin-top: 0.75rem;
			background: transparent;
			border-color: var(--muted);
			color: inherit;
			font-size: 0.875rem;
			font-weight: 400;
		}

		/* The "hidden" attribute needs this, because the rules above set "display". */
		[hidden] {
			display: none !important;
		}
	</style>
</head>
<body>
	<h1>NBA Stats Agent</h1>
	<p class="intro">Ask a basketball question, and an AI agent will look up real stats to answer it.</p>

	<!-- aria-live makes screen readers announce new messages when they appear. -->
	<div id="conversation" aria-live="polite"></div>

	<form id="ask-form">
		<label for="question">Your question</label>
		<div class="ask-row">
			<input id="question" type="text" maxlength="500" autocomplete="off" required
				placeholder="Who leads the league in assists?">
			<button id="ask-button" type="submit">Ask</button>
		</div>
	</form>

	<div class="examples">
		<button type="button">Who leads the league in scoring this season?</button>
		<button type="button">How is Nikola Jokić playing this season?</button>
		<button type="button">Who scored more in 2025-26, Stephen Curry or Kevin Durant?</button>
	</div>

	<button id="new-conversation" type="button" hidden>New conversation</button>

	<script>
		const form = document.getElementById("ask-form");
		const questionInput = document.getElementById("question");
		const askButton = document.getElementById("ask-button");
		const conversation = document.getElementById("conversation");
		const examples = document.querySelector(".examples");
		const exampleButtons = document.querySelectorAll(".examples button");
		const newConversationButton = document.getElementById("new-conversation");

		// The server's "ticket" for this conversation. Null means none has started yet.
		let conversationId = null;

		function addMessage(text, style) {
			const message = document.createElement("div");
			// textContent always displays text as plain text. Using innerHTML here would
			// be unsafe, because the browser would run any HTML that was in the answer.
			message.textContent = text;
			message.className = "message " + style;
			conversation.append(message);
			return message;
		}

		// Disabling the buttons during a request stops an accidental double click from
		// sending, and paying for, the same question twice.
		function setBusy(busy) {
			askButton.disabled = busy;
			newConversationButton.disabled = busy;
			exampleButtons.forEach((button) => (button.disabled = busy));
		}

		// The examples only suit a fresh start, and "New conversation" only suits the reverse.
		function updateButtons() {
			const started = conversation.childElementCount > 0;
			examples.hidden = started;
			newConversationButton.hidden = !started;
		}

		// "async" lets this function wait for the answer without freezing the page.
		async function ask(question) {
			setBusy(true);
			addMessage(question, "question");
			const loading = addMessage("Looking up the stats...", "loading");
			updateButtons();
			questionInput.value = "";

			try {
				const response = await fetch("/ask", {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ question, conversationId }),
				});
				const data = await response.json();

				if (response.ok) {
					conversationId = data.conversationId;
					addMessage(data.answer, "answer");
				} else {
					addMessage(data.error, "error");
					// 404 means the server has forgotten this conversation, so its ID is useless.
					if (response.status === 404) {
						conversationId = null;
					}
					restoreQuestion(question);
				}
			} catch {
				// fetch fails like this when the Java app isn't running or can't be reached.
				addMessage("Couldn't reach the app. Check that it's running and try again.", "error");
				restoreQuestion(question);
			} finally {
				loading.remove();
				setBusy(false);
				questionInput.focus();
			}
		}

		// After a failure, put the question back so it doesn't have to be retyped, unless
		// something new has been typed in the meantime.
		function restoreQuestion(question) {
			if (!questionInput.value) {
				questionInput.value = question;
			}
		}

		form.addEventListener("submit", (event) => {
			// By default a form reloads the page when submitted, which we don't want.
			event.preventDefault();
			const question = questionInput.value.trim();
			if (question) {
				ask(question);
			}
		});

		exampleButtons.forEach((button) => {
			button.addEventListener("click", () => ask(button.textContent));
		});

		newConversationButton.addEventListener("click", () => {
			conversationId = null;
			conversation.replaceChildren();
			updateButtons();
			questionInput.focus();
		});
	</script>
</body>
</html>
